services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-moderateai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-moderateai}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    restart: unless-stopped
    build:
      context: .
      target: prod
      args:
        VITE_SUPPORT_TELEGRAM_URL: ${VITE_SUPPORT_TELEGRAM_URL:-}
        VITE_DOCS_BASE_URL: ${VITE_DOCS_BASE_URL:-}
        VITE_DISCORD_CLIENT_ID: ${VITE_DISCORD_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-moderateai}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}

  proxy:
    image: fholzer/nginx-brotli:latest
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "${APP_PUBLIC_PORT:-5000}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
